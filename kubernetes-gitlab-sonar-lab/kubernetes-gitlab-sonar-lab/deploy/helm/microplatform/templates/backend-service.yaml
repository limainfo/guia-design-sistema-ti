apiVersion: v1
kind: Service
metadata:
  name: {{ include "microplatform.fullname" . }}-backend
  labels:
    {{- include "microplatform.labels" . | nindent 4 }}
    app.kubernetes.io/name: microbackend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: microbackend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if eq .Values.backend.service.type "NodePort" }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
