# Alternativa didática ao BuildKit rootless.
# Requer runner Kubernetes com privileged=true. Não inclua junto com os jobs
# de build padrão sem renomear/remover os jobs existentes.

build-backend-dind:
  stage: build
  image: docker:cli
  services:
    - name: docker:dind
      command: ["--mtu=1450"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container --name lab-builder
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --push -t "$BACKEND_IMAGE:$CI_COMMIT_SHA" apps/backend
  after_script:
    - docker buildx rm lab-builder || true
