workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - quality
  - build
  - deploy
  - verify

default:
  tags:
    - kubernetes
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  SONAR_HOST_URL: "http://sonarqube.sonarqube.svc.cluster.local:9000"
  KUBECTL_VERSION: "v1.35.5"
  HELM_VERSION: "v4.2.3"
  HELM_LINUX_AMD64_SHA256: "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c"

terraform-format:
  stage: validate
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive infra

helm-lint:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl ca-certificates tar gzip
    - curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_LINUX_AMD64_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/helm.tar.gz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
  script:
    - helm lint deploy/helm/microplatform

backend-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - .m2/repository
  script:
    - cd apps/backend
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - apps/backend/target/surefire-reports/TEST-*.xml
    paths:
      - apps/backend/target/site/jacoco/jacoco.xml

frontend-test:
  stage: test
  image: node:20-bookworm
  variables:
    CHROME_BIN: /usr/bin/chromium
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - apps/frontend/.npm/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - rm -rf /var/lib/apt/lists/*
  script:
    - cd apps/frontend
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline --no-audit --no-fund; else npm install --cache .npm --prefer-offline --no-audit --no-fund; fi
    - npm run test:ci
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/frontend/coverage/microfrontend/lcov.info
      - apps/frontend/dist/

backend-sonar:
  stage: quality
  image: maven:3.9.9-eclipse-temurin-21
  needs:
    - job: backend-test
      artifacts: true
  cache:
    key: sonar-maven-$CI_PROJECT_ID
    paths:
      - .m2/repository
      - .sonar/cache
  script:
    - test -n "$SONAR_TOKEN"
    - cd apps/backend
    - >-
      mvn $MAVEN_CLI_OPTS verify sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}-backend"
      -Dsonar.projectName="${CI_PROJECT_PATH}-backend"
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

frontend-sonar:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  needs:
    - job: frontend-test
      artifacts: true
  cache:
    key: sonar-frontend-$CI_PROJECT_ID
    paths:
      - .sonar/cache
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  script:
    - test -n "$SONAR_TOKEN"
    - cd apps/frontend
    - >-
      sonar-scanner
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}-frontend"
      -Dsonar.projectName="${CI_PROJECT_PATH}-frontend"
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.build-image:
  stage: build
  image:
    name: moby/buildkit:v0.31.2-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > "$HOME/.docker/config.json"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-backend:
  extends: .build-image
  needs:
    - backend-sonar
    - frontend-sonar
  script:
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=apps/backend
      --local dockerfile=apps/backend
      --import-cache type=registry,ref=${BACKEND_IMAGE}:buildcache
      --export-cache type=registry,ref=${BACKEND_IMAGE}:buildcache,mode=max
      --output type=image,name=${BACKEND_IMAGE}:${CI_COMMIT_SHA},push=true

build-frontend:
  extends: .build-image
  needs:
    - backend-sonar
    - frontend-sonar
  script:
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=apps/frontend
      --local dockerfile=apps/frontend
      --import-cache type=registry,ref=${FRONTEND_IMAGE}:buildcache
      --export-cache type=registry,ref=${FRONTEND_IMAGE}:buildcache,mode=max
      --output type=image,name=${FRONTEND_IMAGE}:${CI_COMMIT_SHA},push=true

deploy-development:
  stage: deploy
  image: alpine:3.22
  needs:
    - build-backend
    - build-frontend
  resource_group: development
  before_script:
    - apk add --no-cache curl ca-certificates tar gzip
    - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
    - echo "$(cat /tmp/kubectl.sha256)  /usr/local/bin/kubectl" | sha256sum -c -
    - chmod +x /usr/local/bin/kubectl
    - curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_LINUX_AMD64_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/helm.tar.gz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
  script:
    - test -n "$REGISTRY_DEPLOY_USER"
    - test -n "$REGISTRY_DEPLOY_PASSWORD"
    - kubectl auth can-i create deployments -n dev
    - >-
      kubectl -n dev create secret docker-registry gitlab-registry
      --docker-server="$CI_REGISTRY"
      --docker-username="$REGISTRY_DEPLOY_USER"
      --docker-password="$REGISTRY_DEPLOY_PASSWORD"
      --docker-email="devnull@example.invalid"
      --dry-run=client -o yaml | kubectl apply -f -
    - >-
      helm upgrade --install microplatform deploy/helm/microplatform
      --namespace dev
      --set-string backend.image.repository="$BACKEND_IMAGE"
      --set-string backend.image.tag="$CI_COMMIT_SHA"
      --set-string backend.image.pullPolicy="IfNotPresent"
      --set-string frontend.image.repository="$FRONTEND_IMAGE"
      --set-string frontend.image.tag="$CI_COMMIT_SHA"
      --set-string frontend.image.pullPolicy="IfNotPresent"
      --set-string 'imagePullSecrets[0].name=gitlab-registry'
      --atomic
      --timeout 5m
    - kubectl -n dev rollout status deployment/microplatform-backend --timeout=240s
    - kubectl -n dev rollout status deployment/microplatform-frontend --timeout=240s
    - kubectl -n dev get pods -o wide
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify-development:
  stage: verify
  image: curlimages/curl:8.14.1
  needs:
    - deploy-development
  script:
    - curl --fail --show-error --retry 20 --retry-delay 3 http://microplatform-backend.dev.svc.cluster.local:8080/actuator/health/readiness
    - curl --fail --show-error --retry 20 --retry-delay 3 http://microplatform-backend.dev.svc.cluster.local:8080/api/info
    - curl --fail --show-error --retry 20 --retry-delay 3 http://microplatform-frontend.dev.svc.cluster.local/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
